{{- if not .Values.database.auth.existingSecret }}
{{- $name := include "mantis.db.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: the database volumes outlive the release, and a
    # reinstall with new random passwords could not open them.
    helm.sh/resource-policy: keep
# basic-auth because CloudNativePG requires it for the bootstrap secret. The
# extra root-password key is allowed and ignored by it.
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.auth.username | quote }}
  password: {{ include "mantis.secretValue" (dict "ctx" . "secret" $name "key" "password" "value" .Values.database.auth.password) | quote }}
  {{- if eq .Values.database.type "mariadb" }}
  root-password: {{ include "mantis.secretValue" (dict "ctx" . "secret" $name "key" "root-password" "value" .Values.database.auth.rootPassword) | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.mantis.existingSecret }}
{{- $name := include "mantis.app.secretName" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall along with the database: the admin password and salt
    # belong to the data, not to the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ include "mantis.secretValue" (dict "ctx" . "secret" $name "key" "admin-password" "value" .Values.mantis.adminPassword "length" 20) | quote }}
  crypto-master-salt: {{ include "mantis.secretValue" (dict "ctx" . "secret" $name "key" "crypto-master-salt" "value" .Values.mantis.cryptoMasterSalt "length" 64) | quote }}
  {{- if .Values.mantis.email.smtp.password }}
  smtp-password: {{ .Values.mantis.email.smtp.password | quote }}
  {{- end }}
  {{- if .Values.mantis.ldap.bindPassword }}
  ldap-bind-password: {{ .Values.mantis.ldap.bindPassword | quote }}
  {{- end }}
  {{- if .Values.mantis.oidc.enabled }}
  {{- if .Values.mantis.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.mantis.oidc.clientSecret | quote }}
  {{- end }}
  # Shared by every replica, so a login can finish on any of them.
  oidc-crypto-passphrase: {{ include "mantis.secretValue" (dict "ctx" . "secret" $name "key" "oidc-crypto-passphrase" "value" .Values.mantis.oidc.cryptoPassphrase "length" 64) | quote }}
  {{- end }}
{{- end }}
