{{- /*
Ingress-only NetworkPolicies. Each one selects only this release's pods, so
nothing else in the namespace is isolated by them.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mantis.fullname" . }}
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "mantis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    # No `from`: any source, including the router on the host network.
    - ports:
        - port: http
          protocol: TCP
        {{- if .Values.mantis.httpd.https.enabled }}
        - port: https
          protocol: TCP
        {{- end }}
    {{- if or (include "mantis.metrics.apache" .) (include "mantis.metrics.phpFpm" .) }}
    # The exporters, from the metrics scraper only.
    - from:
        {{- include "mantis.metrics.from" . | nindent 8 }}
      ports:
        {{- if include "mantis.metrics.apache" . }}
        - port: apache-metrics
          protocol: TCP
        {{- end }}
        {{- if include "mantis.metrics.phpFpm" . }}
        - port: fpm-metrics
          protocol: TCP
        {{- end }}
    {{- end }}
{{- if ne .Values.database.mode "external" }}
{{- $np := .Values.networkPolicy.database }}
{{- $operator := eq .Values.database.mode "operator" }}
{{- $pg := eq .Values.database.type "postgresql" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mantis.db.serverName" . }}
  labels:
    {{- include "mantis.db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- if and $operator $pg }}
      cnpg.io/cluster: {{ include "mantis.db.serverName" . }}
      {{- else if $operator }}
      {{- /* mariadb-operator replaces app.kubernetes.io/instance with the resource's name. */}}
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ include "mantis.db.serverName" . }}
      {{- else }}
      {{- include "mantis.db.selectorLabels" . | nindent 6 }}
      {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Every pod in this namespace: the application, the schema Job,
        # backups, maintenance pods, and the database's own peers.
        - podSelector: {}
        {{- if $operator }}
        # The operator, on any port.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.operatorNamespace | default (ternary "cnpg-system" "mariadb-operator" $pg) }}
          podSelector:
            matchLabels:
              {{- $np.operatorPodLabels | default (dict "app.kubernetes.io/name" (ternary "cloudnative-pg" "mariadb-operator" $pg)) | toYaml | nindent 14 }}
        {{- end }}
        {{- with $np.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if and $operator $pg .Values.metrics.enabled .Values.metrics.database.enabled }}
    # CloudNativePG's metrics, from the metrics scraper only.
    - from:
        {{- include "mantis.metrics.from" . | nindent 8 }}
      ports:
        - port: 9187
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
