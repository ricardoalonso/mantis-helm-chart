{{- /*
The exporters' Service and ServiceMonitor, and the CloudNativePG PodMonitor.
The exporters have a Service of their own so the one the Route and Ingress
use never carries the metrics ports. mariadb-operator creates its own
ServiceMonitor; see templates/database/mariadb-operator.yaml.
*/ -}}
{{- $mx := .Values.metrics }}
{{- $apache := include "mantis.metrics.apache" . }}
{{- $fpm := include "mantis.metrics.phpFpm" . }}
{{- if or $apache $fpm }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mantis.fullname" . }}-metrics
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "mantis.selectorLabels" . | nindent 4 }}
  ports:
    {{- if $apache }}
    - name: apache-metrics
      port: {{ $mx.apache.port }}
      targetPort: apache-metrics
      protocol: TCP
    {{- end }}
    {{- if $fpm }}
    - name: fpm-metrics
      port: {{ $mx.phpFpm.port }}
      targetPort: fpm-metrics
      protocol: TCP
    {{- end }}
{{- if $mx.serviceMonitor.enabled }}
{{- $scrape := fromYaml (include "mantis.metrics.scrape" $mx.serviceMonitor) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mantis.fullname" . }}
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with $mx.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mantis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    {{- if $apache }}
    - {{ toYaml (merge (dict "port" "apache-metrics") $scrape) | indent 6 | trim }}
    {{- end }}
    {{- if $fpm }}
    - {{ toYaml (merge (dict "port" "fpm-metrics") $scrape) | indent 6 | trim }}
    {{- end }}
{{- end }}
{{- end }}
{{- if and $mx.enabled $mx.database.enabled (eq .Values.database.type "postgresql") (eq .Values.database.mode "operator") }}
{{- $db := $mx.database }}
{{- $scrape := fromYaml (include "mantis.metrics.scrape" (dict "interval" $db.interval "scrapeTimeout" $db.scrapeTimeout "relabelings" $db.podMonitor.relabelings "metricRelabelings" $db.podMonitor.metricRelabelings)) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "mantis.db.serverName" . }}
  labels:
    {{- include "mantis.db.labels" . | nindent 4 }}
    {{- with $db.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "mantis.db.serverName" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - {{ toYaml (merge (dict "port" "metrics") $scrape) | indent 6 | trim }}
{{- end }}
