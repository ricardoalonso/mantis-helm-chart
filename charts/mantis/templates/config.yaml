{{- $m := .Values.mantis -}}
{{- $url := include "mantis.url" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mantis.fullname" . }}-config
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
type: Opaque
stringData:
  config_inc.php: |
    <?php
    # Generated by the {{ .Chart.Name }} Helm chart {{ .Chart.Version }}. Do not edit here: it
    # is replaced on every upgrade. Use mantis.extraConfig in the values instead.
    #
    # Credentials are not in this file. They are read from the Secrets mounted
    # under /mantis/secrets, so this file can be shown without exposing them.

    # --- Database ----------------------------------------------------------
    $g_db_type       = {{ include "mantis.db.driver" . | include "mantis.php.string" }};
    $g_hostname      = {{ printf "%s:%s" (include "mantis.db.host" .) (include "mantis.db.port" .) | include "mantis.php.string" }};
    $g_database_name = {{ .Values.database.name | include "mantis.php.string" }};
    $g_db_username   = trim( file_get_contents( '/mantis/secrets/db/username' ) );
    $g_db_password   = trim( file_get_contents( '/mantis/secrets/db/password' ) );

    # --- Security ----------------------------------------------------------
    $g_crypto_master_salt = trim( file_get_contents( '/mantis/secrets/app/crypto-master-salt' ) );

    # --- Site --------------------------------------------------------------
    {{- if $url }}
    $g_path = {{ $url | include "mantis.php.string" }};
    {{- end }}
    $g_default_timezone = {{ $m.timezone | include "mantis.php.string" }};

    # --- Attachments -------------------------------------------------------
    # On the attachments volume, outside the web root.
    $g_allow_file_upload = ON;
    $g_file_upload_method = DISK;
    $g_absolute_path_default_upload_folder = '/mantis/attachments/';
    $g_max_file_size = {{ int $m.attachments.maxFileSize }};
    $g_file_upload_subdirectory_depth = {{ int $m.attachments.subdirectoryDepth }};
    $g_file_upload_subdirectory_width = {{ int $m.attachments.subdirectoryWidth }};

    # --- Email -------------------------------------------------------------
    {{- if $m.email.enabled }}
    $g_enable_email_notification = ON;
    {{- with $m.email.webmaster }}
    $g_webmaster_email = {{ . | include "mantis.php.string" }};
    {{- end }}
    {{- with $m.email.from }}
    $g_from_email = {{ . | include "mantis.php.string" }};
    {{- end }}
    $g_from_name = {{ $m.email.fromName | include "mantis.php.string" }};
    {{- with ($m.email.returnPath | default $m.email.from) }}
    $g_return_path_email = {{ . | include "mantis.php.string" }};
    {{- end }}
    {{- if $m.email.smtp.host }}
    $g_phpMailer_method = PHPMAILER_METHOD_SMTP;
    $g_smtp_host = {{ $m.email.smtp.host | include "mantis.php.string" }};
    $g_smtp_port = {{ int $m.email.smtp.port }};
    $g_smtp_connection_mode = {{ $m.email.smtp.connectionMode | include "mantis.php.string" }};
    {{- if $m.email.smtp.auth }}
    $g_smtp_username = {{ $m.email.smtp.username | include "mantis.php.string" }};
    $g_smtp_password = trim( file_get_contents( '/mantis/secrets/app/smtp-password' ) );
    {{- end }}
    {{- end }}
    {{- else }}
    # Off until SMTP is configured (mantis.email in the values).
    $g_enable_email_notification = OFF;
    {{- end }}
    {{- if $m.ldap.enabled }}

    # --- LDAP --------------------------------------------------------------
    $g_login_method          = LDAP;
    $g_ldap_server           = {{ $m.ldap.server | include "mantis.php.string" }};
    $g_ldap_root_dn          = {{ $m.ldap.rootDn | include "mantis.php.string" }};
    $g_ldap_organization     = {{ $m.ldap.organization | include "mantis.php.string" }};
    {{- if $m.ldap.bindDn }}
    $g_ldap_bind_dn          = {{ $m.ldap.bindDn | include "mantis.php.string" }};
    $g_ldap_bind_passwd      = trim( file_get_contents( '/mantis/secrets/app/ldap-bind-password' ) );
    {{- end }}
    $g_ldap_uid_field        = {{ $m.ldap.uidField | include "mantis.php.string" }};
    $g_ldap_protocol_version = {{ int $m.ldap.protocolVersion }};
    $g_ldap_use_starttls     = {{ ternary "ON" "OFF" $m.ldap.useStarttls }};
    $g_ldap_follow_referrals = {{ ternary "ON" "OFF" $m.ldap.followReferrals }};
    $g_use_ldap_email        = {{ ternary "ON" "OFF" $m.ldap.useEmail }};
    $g_use_ldap_realname     = {{ ternary "ON" "OFF" $m.ldap.useRealname }};
    {{- end }}
    {{- with $m.extraConfig }}

    # --- mantis.extraConfig ------------------------------------------------
    {{- . | nindent 4 }}
    {{- end }}

    # --- Container runtime settings ----------------------------------------
    # Written by the image on every start (single sign-on, from MANTIS_OIDC_*)
    # and loaded last, so it wins over anything above. The image refuses to
    # start with single sign-on on unless this file loads it.
    if( file_exists( '/etc/mantis/runtime_inc.php' ) ) {
        require '/etc/mantis/runtime_inc.php';
    }
  {{- range $file, $content := $m.extraConfigFiles }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mantis.fullname" . }}-files
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
data:
  schema.php: |
    {{- .Files.Get "files/schema.php" | nindent 4 }}
---
# Drop-ins the image copies into /etc/{php.d,php-fpm.d,httpd/conf.d} at start,
# after its own generated files. Keys are <dir>.<file name>; the Deployment
# maps them back to <dir>/<file name> under /mantis/conf.d.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mantis.fullname" . }}-confd
  labels:
    {{- include "mantis.labels" . | nindent 4 }}
data:
  {{- if eq (toString $m.httpd.statusAllow) "local" }}
  httpd.00-chart-status.conf: |
    # Generated by the {{ .Chart.Name }} Helm chart.
    #
    # /server-status and /php-status list in-flight URLs and client addresses.
    # The image limits them with `Require ip 127.0.0.1`, which mod_remoteip
    # evaluates against the forwarded address, so a pod inside a trusted
    # proxy range could claim to be 127.0.0.1. Match the TCP peer instead.
    <LocationMatch "^/(server-status|php-status)">
        Require expr "%{CONN_REMOTE_ADDR} in {'127.0.0.1', '::1'}"
    </LocationMatch>
  {{- end }}
  {{- range $file, $content := $m.confd.php }}
  php.{{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- range $file, $content := $m.confd.phpFpm }}
  php-fpm.{{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- range $file, $content := $m.confd.httpd }}
  httpd.{{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- with $m.hooks }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mantis.fullname" $ }}-hooks
  labels:
    {{- include "mantis.labels" $ | nindent 4 }}
data:
  {{- range $file, $content := . }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
