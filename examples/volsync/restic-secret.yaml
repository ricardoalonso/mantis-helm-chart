# The restic repository for the attachments, referenced by
# backup.volsync.repository. Keep RESTIC_PASSWORD somewhere outside the
# cluster too: without it the backups cannot be read. Use a bucket that is not
# on the cluster's own storage, and a separate path for each release.
apiVersion: v1
kind: Secret
metadata:
  name: mantis-attachments-restic
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:https://s3.example.com/mantis-backups/attachments
  RESTIC_PASSWORD: CHANGE_ME
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
